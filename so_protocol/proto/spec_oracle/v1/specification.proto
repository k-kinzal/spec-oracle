syntax = "proto3";

// The wire contract between the spec-oracle daemon and its clients.
//
// The wire carries specifications and their derived readings; the daemon owns
// the domain. The client is thin: it sends a specification in the constrained
// specification language plus the (channel-resolved) --evidence values. The
// daemon's Add Mailbox parses exactly one sentence, persists exactly one Node,
// and returns it. NodeAdded Jobs subsequently capture Evidence and derive all
// other structure. A node stores the raw sentence text (and
// the language version that accepted it); the `SentenceView` on each returned
// node — speech act, canonical rendering, contract view — is derived at
// response time. The same ingest contract is also exposed in graph topology as
// content-addressed Assumption and Guarantee nodes.
package spec_oracle.v1;

// The specification graph service. It ingests specifications and reads the
// graph back a bounded page at a time. NodeAdded graph generation connects
// specifications through written term-form vertices and proved semantic
// relationships.
service SpecificationGraph {
  // Parse exactly one specification sentence and persist exactly one Node.
  // Evidence descriptors are opaque Job input on this path: no locator I/O,
  // snapshot, origin enrichment, or graph derivation occurs before the reply.
  // Syntax/sentence-count errors are INVALID_ARGUMENT; store failures are
  // INTERNAL.
  rpc AddSpecification(AddSpecificationRequest) returns (AddSpecificationResponse);

  // Replace the complete desired Evidence descriptor set of an existing
  // Specification Node and schedule a fresh capture. The prior captures and
  // GroundedBy Edges remain immutable Ledger history; only the current
  // Evidence view and fitness input advance.
  rpc ReplaceEvidence(ReplaceEvidenceRequest) returns (ReplaceEvidenceResponse);

  // Append one explicit, versioned selection judgment between existing
  // Specification Nodes. Only Supports, Defeats, and Supersedes are accepted;
  // semantic relationships remain derived exclusively by so-reason.
  rpc AddSelectionRelation(AddSelectionRelationRequest) returns (AddSelectionRelationResponse);

  // Append a proved assume-guarantee pairing. `relied` is an authored
  // specification naming exactly what the target contract awaits; it is not
  // conflated with the source sentence that supplies evidence for it.
  rpc AddAssumptionRelation(AddAssumptionRelationRequest) returns (AddAssumptionRelationResponse);

  // Read the specification graph one bounded page at a time. The graph can hold
  // billions of nodes, so there is deliberately no "return everything" call:
  // the caller walks the graph with keyset pagination (an opaque `page_token`),
  // and the server hard-caps the page size. Each specification page includes
  // its adjacent term-form vertices and checked edges.
  rpc GetGraph(GetGraphRequest) returns (GetGraphResponse);

  // Read immutable Ledger Edges in Edge-id keyset order. Unlike GetGraph this
  // does not select current derivation versions; each returned Edge says
  // whether its derivation/projection is current in the candidate graph. The
  // selected current specification graph additionally requires its
  // Specification endpoints to be selected.
  rpc GetLedger(GetLedgerRequest) returns (GetLedgerResponse);

}

message AddSpecificationRequest {
  // Exactly one sentence in the constrained specification language, e.g.
  // "When the order is submitted, the system shall record the total."
  string specification = 1;
  // Opaque Evidence Job inputs. Each conventionally contains a JSON
  // object/array (kind + locator [+ origin]) or a bare locator string.
  // `@file`/`-`(stdin) channels are resolved client-side to text before
  // sending — the daemon never reads the client's stdin/files.
  repeated string evidence = 2;
  // The creating tool's identity, recorded on each node (sense ③). Empty
  // falls back to a daemon default.
  string client = 3;
  string client_version = 4;
}

message AddSpecificationResponse {
  Node node = 1;
}

message ReplaceEvidenceRequest {
  string node_id = 1;
  // The complete replacement set, not an incremental merge. Empty clears the
  // current Evidence view while preserving its Ledger history.
  repeated string evidence = 2;
}

message ReplaceEvidenceResponse {
  // Stored Node state immediately after replacement; capture remains
  // asynchronous, so meta.evidence may still show the prior successful view
  // until the new Job completes (or be empty when evidence is cleared).
  Node node = 1;
}

message AddSelectionRelationRequest {
  // The supporter, defeater, or superseder Specification Node id.
  string source = 1;
  // The supported, defeated, or superseded Specification Node id.
  string target = 2;
  // Must be EDGE_KIND_SUPPORTS, EDGE_KIND_DEFEATS, or EDGE_KIND_SUPERSEDES.
  EdgeKind kind = 3;
  // Additional Specification Nodes that make this judgment checkable. The
  // endpoints are already intrinsic to the Edge and must not be repeated here.
  repeated string basis_spec_ids = 4;
}

message AddSelectionRelationResponse {
  Edge edge = 1;
}

message AddAssumptionRelationRequest {
  string source = 1;
  string target = 2;
  string relied = 3;
  // OCCURRENCE_RELIANCE, GUARANTEE_DISCHARGE, or ADMISSIBILITY_ENVELOPE.
  EdgeKind kind = 4;
  repeated string basis_spec_ids = 5;
}

message AddAssumptionRelationResponse {
  Edge edge = 1;
}

// ---- graph read ------------------------------------------------------------

message GetGraphRequest {
  // Maximum number of nodes to return in this page. `0` means the server
  // default; the server clamps any value to a hard maximum. A graph view never
  // asks for "everything" — it walks the graph one bounded page at a time.
  uint32 page_size = 1;
  // Opaque continuation token from a previous response's `next_page_token`.
  // Empty starts from the beginning. It is keyset-based (not an offset), so
  // paging cost is independent of how deep into the graph the cursor sits.
  // Treat it as opaque: do not parse or construct it.
  string page_token = 2;
}

message GetGraphResponse {
  // A bounded page of nodes, ordered by a stable key so paging is deterministic.
  repeated Node nodes = 1;
  // Current derived edges owned by the specification nodes on this page. A
  // mention is owned by its specification source. A specification-to-
  // specification Edge is owned by its lexically smaller endpoint, so a full
  // page walk returns every current Edge once even when its other endpoint is
  // on a later page. Consumers of partial walks must defer an Edge until both
  // specification endpoints have arrived. A mention's TermNode endpoint is
  // supplied in term_nodes below.
  repeated Edge edges = 2;
  // Opaque token to fetch the next page; empty when this is the last page.
  string next_page_token = 3;
  // Best-effort total authored-specification count (maintained count, not a
  // scan), so a client can show paging progress without fetching every node.
  uint64 total_nodes = 4;
  // Term forms adjacent to the specifications in this page. A TermNode records
  // normalized written vocabulary, never real-world referent identity.
  repeated TermNode term_nodes = 5;
  // Content-addressed grounding and assume-guarantee projection vertices
  // adjacent to this specification page.
  repeated DerivedNode derived_nodes = 6;
}

message GetLedgerRequest {
  uint32 page_size = 1;
  string page_token = 2;
}

message GetLedgerResponse {
  repeated Edge edges = 1;
  string next_page_token = 2;
  uint64 total_edges = 3;
  // Non-Specification endpoint values needed to render this Edge page.
  repeated TermNode term_nodes = 4;
  repeated DerivedNode derived_nodes = 5;
}

message TermNode {
  string id = 1;
  string form = 2;
  string head = 3;
  string lang_version = 4;
  string derivation_version = 5;
}

message DerivedNode {
  string id = 1;
  oneof value {
    EvidenceNode evidence = 2;
    AssumptionNode assumption = 3;
    GuaranteeNode guarantee = 4;
  }
}

message EvidenceNode {
  Evidence evidence = 1;
}

message AssumptionNode {
  string expression = 1;
  string derivation_version = 2;
  // Canonical serialized so-reason Formula. Empty for legacy/trivial ingest
  // assumptions; authored words remain the display authority.
  string formula_json = 3;
}

message GuaranteeNode {
  string expression = 1;
  string force = 2;
  string derivation_version = 3;
}

enum VertexKind {
  VERTEX_KIND_UNSPECIFIED = 0;
  VERTEX_KIND_SPECIFICATION = 1;
  VERTEX_KIND_TERM = 2;
  VERTEX_KIND_EVIDENCE = 3;
  VERTEX_KIND_ASSUMPTION = 4;
  VERTEX_KIND_GUARANTEE = 5;
}

message TextAnchor {
  string selector = 1;
  string text = 2;
  string role = 3;
}

message Derivation {
  string method = 1;
  string version = 2;
}

// One checked binary claim. Candidate overlap, Unknown, and NotSearched are
// deliberately not graph topology.
message Edge {
  string id = 1;
  // Ordered argument 1 of `kind`; this is not a graph-wide support direction.
  string source = 2;
  // Ordered argument 2 of `kind`; inspect endpoint roles before interpreting it.
  string target = 3;
  EdgeKind kind = 4;
  VertexKind source_kind = 5;
  VertexKind target_kind = 6;
  optional TextAnchor source_anchor = 7;
  optional TextAnchor target_anchor = 8;
  repeated string basis_spec_ids = 9;
  Derivation derivation = 10;
  string recorded_at = 11;
  EdgeFamily family = 12;
  EdgeEndpointRole source_role = 13;
  EdgeEndpointRole target_role = 14;
  // The authored assertion explicitly selected as the target's awaited
  // formula. Set only for assume-guarantee pairing Edges.
  optional string relied_spec_id = 15;
  // True when this immutable Ledger fact is selected by its current
  // derivation/projection policy in the candidate graph. GetGraph only returns
  // true Edges; GetLedger returns both. Membership in the selected current
  // specification graph additionally requires selected Specification
  // endpoints.
  bool current = 16;
}

// The relationship family keeps lexical discovery, semantic truth, versioned
// selection judgments, and deterministic projections distinct in the Ledger.
enum EdgeFamily {
  EDGE_FAMILY_UNSPECIFIED = 0;
  EDGE_FAMILY_LEXICAL = 1;
  EDGE_FAMILY_SEMANTIC = 2;
  EDGE_FAMILY_SELECTION = 3;
  EDGE_FAMILY_PROJECTION = 4;
}

// The role each ordered endpoint plays in its EdgeKind. Symmetric kinds give
// both endpoints the same role and canonicalize ids separately.
enum EdgeEndpointRole {
  EDGE_ENDPOINT_ROLE_UNSPECIFIED = 0;
  EDGE_ENDPOINT_ROLE_MENTIONER = 1;
  EDGE_ENDPOINT_ROLE_MENTIONED_TERM = 2;
  EDGE_ENDPOINT_ROLE_REFINER = 3;
  EDGE_ENDPOINT_ROLE_REFINED = 4;
  EDGE_ENDPOINT_ROLE_EQUIVALENT_PEER = 5;
  EDGE_ENDPOINT_ROLE_CONFLICT_PEER = 6;
  EDGE_ENDPOINT_ROLE_SUPPORTER = 7;
  EDGE_ENDPOINT_ROLE_SUPPORTED = 8;
  EDGE_ENDPOINT_ROLE_DEFEATER = 9;
  EDGE_ENDPOINT_ROLE_DEFEATED = 10;
  EDGE_ENDPOINT_ROLE_SUPERSEDER = 11;
  EDGE_ENDPOINT_ROLE_SUPERSEDED = 12;
  EDGE_ENDPOINT_ROLE_GROUNDED_SPECIFICATION = 13;
  EDGE_ENDPOINT_ROLE_EVIDENCE = 14;
  EDGE_ENDPOINT_ROLE_CONTRACT_SPECIFICATION = 15;
  EDGE_ENDPOINT_ROLE_ASSUMPTION = 16;
  EDGE_ENDPOINT_ROLE_GUARANTEE = 17;
  EDGE_ENDPOINT_ROLE_RELIANCE_EVIDENCE = 18;
  EDGE_ENDPOINT_ROLE_RELIANT_CONTRACT = 19;
  EDGE_ENDPOINT_ROLE_DISCHARGING_GUARANTEE = 20;
  EDGE_ENDPOINT_ROLE_DISCHARGED_CONTRACT = 21;
  EDGE_ENDPOINT_ROLE_ADMISSIBLE_ENVIRONMENT = 22;
  EDGE_ENDPOINT_ROLE_BOUNDED_CONTRACT = 23;
}

// The kind of relationship an Edge asserts. Its direction is its endpoint-role
// order, not one universal flow shared by all kinds.
enum EdgeKind {
  EDGE_KIND_UNSPECIFIED = 0;
  reserved 1 to 7;
  EDGE_KIND_MENTIONS_TERM = 8;
  // Directed: source is the concrete specification, target the abstract one.
  EDGE_KIND_REFINES = 9;
  // Symmetric kinds use lexically ordered endpoints for stable identity.
  EDGE_KIND_EQUIVALENT = 10;
  EDGE_KIND_HARD_CONTRADICTION = 11;
  EDGE_KIND_ADVISORY_TENSION = 12;
  EDGE_KIND_DESCRIPTIVE_CONFLICT = 13;
  EDGE_KIND_ENVELOPE_CONFLICT = 14;
  // Selection-family relations are versioned judgments, not reinterpretations
  // or reversals of semantic Edges.
  EDGE_KIND_SUPPORTS = 15;
  EDGE_KIND_DEFEATS = 16;
  EDGE_KIND_SUPERSEDES = 17;
  EDGE_KIND_GROUNDED_BY = 18;
  EDGE_KIND_HAS_ASSUMPTION = 19;
  EDGE_KIND_HAS_GUARANTEE = 20;
  EDGE_KIND_OCCURRENCE_RELIANCE = 21;
  EDGE_KIND_GUARANTEE_DISCHARGE = 22;
  EDGE_KIND_ADMISSIBILITY_ENVELOPE = 23;
}

// ---- domain mirror ---------------------------------------------------------

// A persisted specification node. The raw sentence text (`statement`) is the
// source of truth; `sentence` is absent from Add and derived for graph reads.
message Node {
  string id = 1;
  // The raw sentence text, exactly as accepted.
  string statement = 2;
  // The version of the language that accepted the sentence.
  string lang_version = 3;
  // Derived reading of the sentence — never stored.
  SentenceView sentence = 4;
  Meta meta = 5;
  // Present on graph reads. AddSpecification returns stored facts only and
  // leaves this absent. This view is derived from the current version of the
  // fitness selection policy; it is never persisted into the authored Node.
  SelectionView selection = 6;
}

// The current-set projection of one authored Specification Node. Admission
// creates a candidate, never automatic authority. A versioned fitness policy
// derives score and exclusions entirely from current Ledger relationships.
message SelectionView {
  bool current = 1;
  repeated string supporting_edge_ids = 2;
  repeated string defeating_edge_ids = 3;
  repeated string superseding_edge_ids = 4;
  string policy_version = 5;
  sint32 support_score = 6;
  sint32 evidence_score = 7;
  sint32 relation_score = 8;
  repeated ScoreContribution contributions = 9;
  repeated SelectionExclusion exclusions = 10;
}

// One auditable term in the fitness sum. `points` is effective after policy
// caps, so summing the list reproduces support_score exactly.
message ScoreContribution {
  string kind = 1;
  sint32 points = 2;
  string edge_id = 3;
  optional string source_node_id = 4;
  optional string evidence_node_id = 5;
  string detail = 6;
}

// One independently checkable reason a candidate is absent from current set.
message SelectionExclusion {
  string kind = 1;
  optional string edge_id = 2;
  optional string competing_node_id = 3;
  string detail = 4;
}

// The specification act a sentence performs.
enum SpeechAct {
  SPEECH_ACT_UNSPECIFIED = 0;
  SPEECH_ACT_DEFINITION = 1;
  SPEECH_ACT_DESCRIPTION = 2;
  SPEECH_ACT_OBLIGATION = 3;
  SPEECH_ACT_PROHIBITION = 4;
  SPEECH_ACT_RECOMMENDATION = 5;
  SPEECH_ACT_PERMISSION = 6;
}

// The derived reading of one sentence.
message SentenceView {
  SpeechAct speech_act = 1;
  // The canonical rendering of the sentence.
  string canonical = 2;
  // The assume-guarantee reading. Absent for definitions, which establish
  // vocabulary, not behavior, and for permissions, which admit behavior
  // rather than constrain it and enter a contract only through pairing, on
  // the environment side.
  ContractView contract = 3;
}

// The assume-guarantee reading of one sentence, as a display convenience.
message ContractView {
  // "⊤" at ingest: a sentence taken alone assumes nothing of its environment;
  // non-trivial assumptions are graph-level pairings between sentences.
  string assumption = 1;
  // The rendered assertion: the canonical sentence without its purpose part.
  string guarantee = 2;
  // "binding" | "recommended" | "" (descriptions carry no force; permissions
  // never produce a ContractView at all).
  string force = 4;
}

message Meta {
  // Current successfully captured view, populated asynchronously by the
  // Evidence Job. Complete historical captures also remain in Job updates.
  repeated Evidence evidence = 1;
  string created_at = 2;
  string cli = 3;
  string cli_version = 4;
  // Successful asynchronous Meta updates. Job scheduling and retry state are
  // process-local and are never persisted or exposed on the wire.
  repeated MetaUpdate updates = 5;
  // Verbatim, channel-resolved descriptors retained until and after the
  // asynchronous Evidence Job captures them. This makes retry/reconciliation
  // independent of the original client process.
  repeated string evidence_requests = 6;
  // Latest complete-request replacement generation. Empty means the original
  // incremental Add request set. Used to reconcile unchanged-locator refreshes.
  string evidence_request_generation = 7;
}

message MetaUpdate {
  // Mailbox-derived Job identity; repeated execution replaces this result.
  string id = 1;
  // Stable Plugin/hook name.
  string source = 2;
  string applied_at = 3;
  // Plugin-owned JSON value.
  string value_json = 4;
}

message Evidence {
  Kind kind = 1;
  Locator locator = 2;
  Snapshot snapshot = 3;
  Origin origin = 4;
}

// Epistemic kind of a piece of evidence. UNSPECIFIED (the proto3 default) is
// treated as UNKNOWN by the daemon, so an absent kind is never load-bearing.
enum Kind {
  KIND_UNSPECIFIED = 0;
  KIND_UNKNOWN = 1;
  KIND_CONSTITUTIVE = 2;
  KIND_DEMONSTRATIVE = 3;
  KIND_TESTIMONIAL = 4;
  KIND_ASSERTORIC = 5;
  KIND_CIRCUMSTANTIAL = 6;
  KIND_COUNTER = 7;
}

message Locator {
  oneof value {
    FileLocator file = 1;
    UrlLocator url = 2;
  }
}

message FileLocator {
  string path = 1;
  optional uint32 line = 2;
  optional uint32 col = 3;
}

message UrlLocator {
  string url = 1;
}

// The captured observation of a locator (provenance sense ②). The captured
// bytes are NOT carried on the wire — the content-addressed blob store is the
// byte authority — only the hash pointer and metadata.
message Snapshot {
  string content_hash = 1;
  uint64 bytes = 2;
  string captured_at = 3;
  Anchor anchor = 4;
}

message Anchor {
  oneof value {
    GitAnchor git = 1;
    WorktreeAnchor worktree = 2;
    WebAnchor web = 3;
  }
}

message GitAnchor {
  string commit = 1;
  bool dirty = 2;
}

message WorktreeAnchor {}

message WebAnchor {
  string retrieved_at = 1;
  uint32 status = 2;
  optional string content_type = 3;
  optional string last_modified = 4;
}

// The source artifact's own provenance (sense ①). Every field is optional.
message Origin {
  optional string author = 1;
  optional string created_at = 2;
  optional string updated_at = 3;
}
