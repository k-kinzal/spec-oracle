syntax = "proto3";

// The contract between the spec-oracle daemon and its clients.
//
// The client is thin: it sends a constrained-NL statement and the (channel-
// resolved) --evidence values. The daemon parses, captures evidence, enriches
// origin, persists the node, and returns it. The `Node`/`Evidence`/... messages
// below mirror the daemon's domain types 1:1; the mirror is deliberate so the
// wire format is legible on its own and the daemon domain need not leak.
package spec_oracle.v1;

// The specification graph service. Today it ingests a single contract node;
// edges (refinement/composition/…) and queries attach here later.
service ContractGraph {
  // Ingest one constrained-NL statement with its evidence, returning the
  // persisted node. Errors are surfaced as gRPC statuses: INVALID_ARGUMENT for
  // bad input (grammar/evidence — user-fixable), INTERNAL for capture/store
  // failures (environment/runtime).
  rpc AddContract(AddContractRequest) returns (AddContractResponse);
}

message AddContractRequest {
  // The constrained-NL statement, e.g.
  // "When the order is submitted, the system shall record the total."
  string statement = 1;
  // Evidence values. Each is a JSON object/array (kind + locator [+ origin]) or
  // a bare locator string. `@file`/`-`(stdin) channels are resolved client-side
  // to text before sending — the daemon never reads the client's stdin/files.
  repeated string evidence = 2;
  // The creating tool's identity, recorded on the node (sense ③). Empty falls
  // back to a daemon default.
  string client = 3;
  string client_version = 4;
}

message AddContractResponse {
  Node node = 1;
}

// ---- domain mirror ---------------------------------------------------------

message Node {
  string id = 1;
  string statement = 2;
  Assumption assumption = 3;
  Guarantee guarantee = 4;
  Meta meta = 5;
}

// The assumption. An empty `conditions` list is the ubiquitous case ⊤ (Top);
// a non-empty list is the conjunction of the leading condition clauses.
message Assumption {
  repeated Condition conditions = 1;
}

message Condition {
  string keyword = 1;
  string text = 2;
}

message Guarantee {
  string subject = 1;
  string response = 2;
}

message Meta {
  repeated Evidence evidence = 1;
  string created_at = 2;
  string cli = 3;
  string cli_version = 4;
}

message Evidence {
  Kind kind = 1;
  Locator locator = 2;
  Snapshot snapshot = 3;
  Origin origin = 4;
}

// Epistemic kind of a piece of evidence. UNSPECIFIED (the proto3 default) is
// treated as UNKNOWN by the daemon, so an absent kind is never load-bearing.
enum Kind {
  KIND_UNSPECIFIED = 0;
  KIND_UNKNOWN = 1;
  KIND_CONSTITUTIVE = 2;
  KIND_DEMONSTRATIVE = 3;
  KIND_TESTIMONIAL = 4;
  KIND_ASSERTORIC = 5;
  KIND_CIRCUMSTANTIAL = 6;
  KIND_COUNTER = 7;
}

message Locator {
  oneof value {
    FileLocator file = 1;
    UrlLocator url = 2;
  }
}

message FileLocator {
  string path = 1;
  optional uint32 line = 2;
  optional uint32 col = 3;
}

message UrlLocator {
  string url = 1;
}

// The captured observation of a locator (provenance sense ②). The captured
// bytes are NOT carried on the wire — the content-addressed blob store is the
// byte authority — only the hash pointer and metadata.
message Snapshot {
  string content_hash = 1;
  uint64 bytes = 2;
  string captured_at = 3;
  Anchor anchor = 4;
}

message Anchor {
  oneof value {
    GitAnchor git = 1;
    WorktreeAnchor worktree = 2;
    WebAnchor web = 3;
  }
}

message GitAnchor {
  string commit = 1;
  bool dirty = 2;
}

message WorktreeAnchor {}

message WebAnchor {
  string retrieved_at = 1;
  uint32 status = 2;
  optional string content_type = 3;
  optional string last_modified = 4;
}

// The source artifact's own provenance (sense ①). Every field is optional.
message Origin {
  optional string author = 1;
  optional string created_at = 2;
  optional string updated_at = 3;
}
